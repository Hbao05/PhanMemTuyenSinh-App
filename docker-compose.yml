services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql_project_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: QLTS_DB
      MYSQL_USER: user123
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: